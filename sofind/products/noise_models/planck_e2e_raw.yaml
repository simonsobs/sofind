legacy_deep56:
  noise_model_class: Harmonic
  data_model_name: planck
  subproduct: e2e_raw
  maps_product: maps
  maps_subproduct: deep56_geom_only
  calibrated: false
  calibrations_subproduct: null
  catalogs_subproduct: null
  catalog_name: null
  inpaint_radius: null
  inpaint_thumb_width: null
  differenced: false
  dtype: f4
  enforce_equal_qid_kwargs:
  - freq
  - num_splits
  filter_kwargs:
    lim: null
    lim0: null
    post_filt_rel_downgrade: 1
  iso_filt_method: null
  ivar_filt_method: null
  ivar_fwhms: null
  ivar_lmaxs: null
  kfilt_lbounds: null
  masks_subproduct: null
  mask_est_name: null
  mask_est_edgecut: 0
  mask_est_apodization: 0
  mask_obs_name: null
  mask_obs_edgecut: 0
  model_lim: null
  model_lim0: null
  qid_names_template: '{freq}'
  srcfree: false
  filter_only: true
  model_file_template: ''
  sim_file_template: '{config_name}_legacy_noise_{qid_names}_lmax{lmax}_{num_splits}way_set{split_num}_noise_sim_{alm_str}{sim_num:04}'

